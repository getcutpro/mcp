name: Feature request
description: Something you would like the AI to do with CutPro.
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like to do
      description: Describe it as you would ask the AI, for example "schedule my best clip every morning".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
