name: README

# The tools follow the live API, so the list in the README is refreshed every day, not only on release.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
      - run: bun run src/index.ts readme README.md
      - run: bun x prettier --write README.md
      - name: Commit when the list changed
        run: |
          git diff --quiet README.md && exit 0
          git -c user.name=ToledoSDL -c user.email=lucastoledoaraujo999@gmail.com commit -am "Update the tool list from the live API"
          git push
